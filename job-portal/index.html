<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Portal</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/filters.css">
  <link rel="stylesheet" href="css/job-card.css">
  <link rel="stylesheet" href="css/pagination.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/bookmark.css">
   <link rel="stylesheet" href="css/modal.css">
</head>

<body>

<main>

<header class="navbar">
  <div class="logo">CareerPath</div>

  <nav class="nav-links" id="navLinks">
    <a href="index.html">Jobs</a>
    <a href="saved-jobs.html">Saved Jobs</a>
    <a href="applied-jobs.html">Applied Jobs</a>

   <div class="profile-container">
  <button id="profileBtn" class="profile-btn">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
    </svg>
  </button>

  <div id="profileDropdown" class="profile-dropdown hidden">
    <div id="profileLoggedOut" class="hidden">
      <button id="loginFromProfile" class="profile-action-btn">Login</button>
    </div>

    <div id="profileLoggedIn" class="hidden">
      <div class="profile-info">
        <p id="profileName"></p>
        <p id="profileEmail"></p>
      </div>

      <div class="profile-stats">
        <div>
          <span id="savedCount">0</span>
          <small>Saved Jobs</small>
        </div>
        <div>
          <span id="appliedCount">0</span>
          <small>Applied Jobs</small>
        </div>
      </div>

      <button id="logoutFromProfile" class="profile-action-btn logout">
        Logout
      </button>
    </div>
  </div>
</div>

  </nav>

  <button class="menu-btn" id="menuBtn">☰</button>
</header>

<section class="search-section">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by job title, company, location or type" />
    <span id="clearSearch" class="clear-search hidden">✕</span>
    <button>Search</button>
  </div>
</section>

<section class="filters">
  <select id="filterType">
    <option value="">All Job Types</option>
  </select>

  <select id="filterLocation">
    <option value="">All Locations</option>
  </select>

  <select id="filterExperience">
    <option value="">All Experience Levels</option>
  </select>

  <select id="sortSelect">
    <option value="">Sort By</option>
    <option value="company">Company Name</option>
    <option value="experience">Experience</option>
  </select>
</section>

<section id="jobListPage">
  <div id="jobGrid" class="job-grid"></div>
  <div class="pagination"></div>
</section>

<section id="jobDetailsPage" class="job-details hidden">
  <h2 id="detailsTitle" class="details-title"></h2>
  <p id="detailsCompany" class="details-company"></p>
  <div id="jobDetailsContent"></div>
</section>

<div id="accessModal" class="modal hidden">
  <div class="modal-content">
    <p id="modalMessage"></p>
    <div class="modal-actions">
      <button id="loginRedirectBtn">Login</button>
      <button id="closeModal">Close</button>
    </div>
  </div>
</div>

</main>

<script type="module" src="js/script.js"></script>

</body>
</html>
