<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<div class="auth-container">
  <h2>Register</h2>
  <input type="text" id="nameInput" placeholder="Enter your name here" />
  <input type="email" id="emailInput" placeholder="Enter your Email here" />
  <input type="password" id="passwordInput" placeholder="Enter Password" />
  <button id="registerBtn">Register</button>
  <div id="error" class="error"></div>
  <p class="register-link" id="loginLink">Already have an account? Login</p>
</div>

<script type="module" src="js/register/register.js"></script>
</body>
</html>
