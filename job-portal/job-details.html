<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Details</title>

  <link rel="stylesheet" href="css/job-details.css" />
</head>

<body>

<div class="job-details-wrapper">

  <button class="close-button" id="closeJob">✕</button>

  <h1 id="jobTitle"></h1>

  <section class="detail-section">
    <h2>Job Description</h2>
    <p id="jobDescription"></p>
  </section>

  <section class="detail-section">
    <h2>Responsibilities</h2>
    <ul id="jobResponsibilities"></ul>
  </section>

  <section class="detail-section">
    <h2>Skills Required</h2>
    <ul id="jobSkills"></ul>
  </section>

  <section class="detail-section">
    <h2>Job Information</h2>
    <ul class="job-info-list">
      <li><strong>Company:</strong> <span id="jobCompany"></span></li>
      <li><strong>Location:</strong> <span id="jobLocation"></span></li>
      <li><strong>Type:</strong> <span id="jobType"></span></li>
      <li><strong>Experience:</strong> <span id="jobExperience"></span></li>
    </ul>
  </section>

  <button id="applyBtn" class="apply-btn">
    Apply Now
  </button>
  
  <div id="uploadModal" class="modal">
  <div class="modal-content">
    <h3>Upload Resume</h3>
    <button id="uploadBtn">Upload Resume</button>
    <button id="cancelBtn">Cancel</button>
  </div>
</div>

</div>
<script type="module" src="js/job-details.js"></script>
</body>
</html>
