<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Details</title>

  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/job-details.css" />
</head>

<body>

<div class="job-details-wrapper">

  <button id="closeJob" class="close-button">✕</button>

  <h1 id="jobTitle" class="job-title"></h1>

  <section class="detail-section">
    <h2>Description</h2>
    <p id="jobDescription"></p>
  </section>

  <section class="detail-section">
    <h2>Responsibilities</h2>
    <ul id="jobResponsibilities"></ul>
  </section>

  <section class="detail-section">
    <h2>Skills</h2>
    <ul id="jobSkills"></ul>
  </section>

  <section class="job-meta-section">
    <div class="job-meta-item">
      <div class="meta-label">Location</div>
      <div id="jobLocation" class="meta-value"></div>
    </div>

    <div class="job-meta-item">
      <div class="meta-label">Experience</div>
      <div id="jobExperience" class="meta-value"></div>
    </div>
  </section>

  <button id="applyBtn" class="apply-btn">Apply Now</button>

  <div id="accessModal" class="modal hidden">
    <div class="modal-content">
      <p id="modalMessage"></p>
      <div class="modal-actions">
        <button id="loginRedirectBtn">Login</button>
        <button id="closeModal">Close</button>
      </div>
    </div>
  </div>

  <div id="uploadModal" class="modal hidden">
    <div class="modal-content">
      <h3>Upload Resume</h3>
      <button id="uploadBtn">Upload</button>
      <button id="cancelBtn">Cancel</button>
    </div>
  </div>

</div>

<script type="module" src="js/job-details.js"></script>
</body>
</html>
