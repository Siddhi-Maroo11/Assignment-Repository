<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">

<div class="auth-container">
  <h2>Reset Password</h2>

  <input id="emailInput" type="email" placeholder="Registered Email" />
  <input id="newPasswordInput" type="password" placeholder="New Password" />
  <input id="confirmPasswordInput" type="password" placeholder="Confirm Password" />

  <button id="resetBtn">Reset Password</button>
  <div id="error" class="error"></div>
</div>

<script type="module" src="js/login/forgotPassword.js"></script>
</body>
</html>
